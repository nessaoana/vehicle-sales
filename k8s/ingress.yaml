# Roteado pelo Traefik (load balancer do cluster). A prioridade explícita faz
# /vehicles/available e /vehicles/sold ganharem do prefixo /vehicles do
# vehicle-core. Sem ela o Traefik desempata pelo tamanho da regra, e
# Path(`/vehicles/sold`) empata com PathPrefix(`/vehicles`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vehicle-sales
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /vehicles/available
            pathType: Exact
            backend:
              service:
                name: vehicle-sales-api
                port:
                  name: http
          - path: /vehicles/sold
            pathType: Exact
            backend:
              service:
                name: vehicle-sales-api
                port:
                  name: http
          - path: /sales
            pathType: Prefix
            backend:
              service:
                name: vehicle-sales-api
                port:
                  name: http
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: vehicle-sales-api
                port:
                  name: http

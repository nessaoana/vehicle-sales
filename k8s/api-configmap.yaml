apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-sales-api
data:
  POSTGRES_DB: vehicle_sales
  POSTGRES_HOST: vehicle-sales-db
  AWS_DEFAULT_REGION: us-east-1
  DEBUG: "false"
  # Comunicação interna com o vehicle-core pelo DNS do cluster, sem passar pelo API Gateway.
  VEHICLE_CORE_URL: http://vehicle-core-api.vehicle-core.svc.cluster.local:8000
  VEHICLE_CORE_TIMEOUT_SECONDS: "5"

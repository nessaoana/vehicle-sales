apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-sales-api
  labels:
    app: vehicle-sales-api
spec:
  # Sem "replicas": quem controla a quantidade de pods é o HPA.
  selector:
    matchLabels:
      app: vehicle-sales-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vehicle-sales-api
    spec:
      # A API cria o schema só na inicialização, então espera o banco aceitar conexões.
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h vehicle-sales-db -p 5432; do echo aguardando banco; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          image: vehicle-sales-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vehicle-sales-api
            - secretRef:
                name: vehicle-sales-db
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false

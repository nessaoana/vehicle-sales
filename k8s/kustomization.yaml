apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vehicle-sales

resources:
  - namespace.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - hpa.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: vehicle-platform
    includeSelectors: false

# O deploy troca a imagem com: kustomize edit set image vehicle-sales-api=<usuario>/vehicle-sales:<tag>
images:
  - name: vehicle-sales-api
    newName: nessaoana/vehicle-sales
    newTag: main

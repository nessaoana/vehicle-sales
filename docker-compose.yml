services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: vehicle-sales-api
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    environment:
      VEHICLE_CORE_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vehicle-sales-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_sales}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vehicle_sales}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
